[project]
name = "slopgate"
version = "0.1.0"
description = "A 100 ms open-weight gatekeeper that triages pull requests for spam, AI slop and prompt injection."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
slopgate = "slopgate.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["slopgate"]
