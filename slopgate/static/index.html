<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SlopGate Arena</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #14171c; --muted: #5d6673; --line: #e3e6eb;
    --accent: #2f6fed; --spam: #c62828; --changes: #d9622b; --review: #b58a00; --fast: #1f8a4c; --none: #8a929e;
    --bar: #e9ecf1; --shadow: 0 1px 2px rgba(16, 24, 40, .06);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1216; --panel: #171b21; --ink: #e8ebf0; --muted: #9aa3af; --line: #262c35;
      --accent: #6b9bff; --spam: #ff6b6b; --changes: #ff9a5c; --review: #f2c94c; --fast: #4ccf86; --none: #7d8590;
      --bar: #232933; --shadow: none; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .num { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  main { max-width: 1160px; margin: 0 auto; padding: 28px 16px 64px; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
  header p { margin: 0; color: var(--muted); }
  header a { margin-left: auto; color: var(--accent); text-decoration: none; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 28px 0 10px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  form { display: flex; gap: 8px; margin-top: 18px; }
  input { flex: 1; min-width: 0; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
          background: var(--panel); color: var(--ink); font: inherit; }
  button { padding: 11px 18px; border-radius: 10px; border: 0; background: var(--accent); color: #fff;
           font: inherit; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel);
          color: var(--muted); font-size: 13px; cursor: pointer; }
  .chip:hover { color: var(--ink); border-color: var(--muted); }
  #pr { padding: 16px 18px; margin-top: 18px; display: none; }
  #pr .title { font-size: 18px; font-weight: 650; }
  #pr .meta { color: var(--muted); font-size: 13px; }
  #pr ul { margin: 10px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; margin-top: 12px; }
  .card { padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; position: relative; }
  .card .head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .card .name { font-weight: 650; }
  .kind { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
          border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
  .time { font-size: 28px; font-weight: 650; letter-spacing: -.02em; }
  .time small { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 6px; letter-spacing: 0; }
  .running .time { color: var(--muted); }
  .verdict { align-self: flex-start; font-weight: 650; font-size: 13px; padding: 3px 10px; border-radius: 999px;
             color: #fff; background: var(--none); }
  .v-spam { background: var(--spam); } .v-needs_changes { background: var(--changes); }
  .v-needs_review { background: var(--review); color: #1d1600; } .v-fast_track { background: var(--fast); }
  .bar { height: 6px; border-radius: 3px; background: var(--bar); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--spam); width: 0; transition: width .4s; }
  .small { font-size: 12.5px; color: var(--muted); }
  .rank { position: absolute; top: -9px; right: 12px; font-size: 11px; font-weight: 700; padding: 1px 7px;
          border-radius: 999px; background: var(--ink); color: var(--panel); }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } form { flex-direction: column; } }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  tr:last-child td { border-bottom: 0; }
  .feed-item { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .feed-item:last-child { border-bottom: 0; }
  .feed-item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { padding: 16px; color: var(--muted); font-size: 13.5px; }
  .scroll { overflow-x: auto; }
</style>
</head>
<body>
<main>
  <header>
    <h1>SlopGate Arena</h1>
    <p>One pull request, every judge, side by side.</p>
    <a href="https://github.com/CTAGRAM/slopgate">GitHub →</a>
  </header>

  <form id="form">
    <input id="url" placeholder="https://github.com/OWNER/REPO/pull/123" autocomplete="off" required>
    <button id="go">Judge it</button>
  </form>
  <div class="chips" id="presets"></div>

  <section id="pr" class="panel"></section>
  <div class="grid" id="grid"></div>

  <div class="cols">
    <section>
      <h2>Live gate · webhook triages</h2>
      <div class="panel" id="feed"><div class="empty">Open a PR on the demo repo and it appears here within a second.</div></div>
    </section>
    <section>
      <h2>Scoreboard · held-out pull requests</h2>
      <div class="panel scroll" id="board"><div class="empty">Run <span class="num">eval/run.py</span> to fill this in.</div></div>
    </section>
  </div>
</main>

<script>
const PRESETS = [
  ["Demo: spam", "https://github.com/CTAGRAM/slopgate-demo/pull/2"],
  ["Demo: real fix", "https://github.com/CTAGRAM/slopgate-demo/pull/3"],
  ["Demo: injection", "https://github.com/CTAGRAM/slopgate-demo/pull/4"],
  ["Demo: AI slop", "https://github.com/CTAGRAM/slopgate-demo/pull/5"],
  ["OpsiMate#1077 (labelled spam)", "https://github.com/OpsiMate/OpsiMate/pull/1077"],
  ["cloudflare-docs#34246 (labelled spam)", "https://github.com/cloudflare/cloudflare-docs/pull/34246"],
  ["psf/requests#7609 (merged)", "https://github.com/psf/requests/pull/7609"],
];
const VERDICT = { spam: "Spam", needs_changes: "Needs changes", needs_review: "Needs review", fast_track: "Fast-track" };
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

function fmt(sec) {
  if (sec == null) return "–";
  if (sec < 1) return `${Math.round(sec * 1000)} ms`;
  if (sec < 120) return `${sec.toFixed(1)} s`;
  return `${(sec / 60).toFixed(1)} min`;
}

for (const [label, url] of PRESETS) {
  const c = el("button", "chip", label);
  c.type = "button";
  c.onclick = () => { $("url").value = url; judge(url); };
  $("presets").append(c);
}
$("form").onsubmit = (e) => { e.preventDefault(); judge($("url").value.trim()); };

let source = null, timers = new Map(), finished = 0;

function judge(url) {
  if (source) source.close();
  timers.clear(); finished = 0;
  $("grid").replaceChildren();
  const pr = $("pr"); pr.style.display = "block"; pr.replaceChildren(el("div", "meta", "Reading the pull request from GitHub…"));
  $("go").disabled = true;
  source = new EventSource(`/arena/stream?url=${encodeURIComponent(url)}`);

  source.addEventListener("pr", (e) => {
    const d = JSON.parse(e.data);
    const link = el("a", "title", d.title); link.href = d.url; link.target = "_blank"; link.style.color = "inherit";
    const ul = el("ul"); d.facts.forEach((f) => ul.append(el("li", null, f)));
    pr.replaceChildren(link, el("div", "meta", `${d.repo}#${d.number} · by @${d.author}`), ul);
  });

  source.addEventListener("start", (e) => {
    const t0 = performance.now();
    for (const c of JSON.parse(e.data).contenders) {
      const card = el("div", "card panel running");
      const head = el("div", "head"); head.append(el("div", "name", c.name), el("span", "kind", "…"));
      const time = el("div", "time num", "0 ms");
      const verdict = el("span", "verdict", "Thinking…");
      const bar = el("div", "bar"); bar.append(el("i"));
      card.append(head, time, verdict, bar, el("div", "small", ""));
      $("grid").append(card);
      timers.set(c.name, { card, t0 });
    }
    tick();
  });

  source.addEventListener("opinion", (e) => {
    const o = JSON.parse(e.data);
    const t = timers.get(o.contender); if (!t) return;
    t.done = true;
    const [head, time, verdict, bar, small] = t.card.children;
    t.card.classList.remove("running");
    head.children[1].textContent = o.kind;
    const observed = o.kind === "Observed";
    time.replaceChildren(document.createTextNode(fmt(o.seconds)));
    if (observed && o.seconds != null) time.append(el("small", null, "on GitHub"));
    else if (o.model_seconds != null) time.append(el("small", null, `model ${fmt(o.model_seconds)}`));
    verdict.className = `verdict v-${o.verdict || "none"}`;
    verdict.textContent = o.error ? "Error" : (VERDICT[o.verdict] || "No opinion");
    bar.firstChild.style.width = o.p_spam == null ? "0" : `${Math.round(o.p_spam * 100)}%`;
    bar.style.visibility = o.p_spam == null ? "hidden" : "visible";
    const bits = [];
    if (o.p_spam != null) bits.push(`P(spam) ${o.p_spam.toFixed(2)}`);
    if (o.tokens) bits.push(`${o.tokens.toLocaleString()} tokens`);
    bits.push(o.error || o.detail);
    small.textContent = bits.filter(Boolean).join(" · ");
    if (!observed && !o.error) { finished += 1; t.card.append(el("span", "rank", `#${finished}`)); }
  });

  source.addEventListener("fail", (e) => { pr.replaceChildren(el("div", "meta", `Could not read that PR: ${JSON.parse(e.data).error}`)); end(); });
  source.addEventListener("done", end);
  source.onerror = end;
}

function end() { if (source) source.close(); source = null; $("go").disabled = false; }

function tick() {
  let running = false;
  for (const t of timers.values()) {
    if (t.done) continue;
    running = true;
    t.card.children[1].textContent = fmt((performance.now() - t.t0) / 1000);
  }
  if (running) requestAnimationFrame(tick);
}

async function loadFeed() {
  try {
    const items = await (await fetch("/feed")).json();
    if (!items.length) return;
    const rows = items.map((d) => {
      const row = el("div", "feed-item");
      const v = el("span", `verdict v-${d.verdict}`, VERDICT[d.verdict]);
      const a = el("a", "t", d.title); a.href = d.url; a.target = "_blank"; a.style.color = "inherit";
      row.append(v, a, el("span", "small num", `${Math.round(d.server_ms || d.wall_ms)} ms`));
      return row;
    });
    $("feed").replaceChildren(...rows);
  } catch {}
}
setInterval(loadFeed, 2000); loadFeed();

async function loadBoard() {
  try {
    const r = await (await fetch("/results")).json();
    if (!r) return;
    const pct = (v) => v == null ? "–" : `${Math.round(v * 100)}%`;
    const table = el("table");
    const head = el("tr"); ["Judge", "Spam caught", "Precision", "Spam fast-tracked", "Median time"].forEach((h) => head.append(el("th", null, h)));
    table.append(head);
    for (const c of r.contenders) {
      const tr = el("tr");
      [c.name, pct(c.recall), pct(c.precision), pct(c.waved), fmt(c.median)].forEach((v, i) => tr.append(el("td", i ? "num" : null, v)));
      table.append(tr);
    }
    $("board").replaceChildren(table, el("div", "empty",
      `Held out: ${r.n} real PRs that CodeRabbit reviewed, never used to build SlopGate. ${r.spam} labelled spam by maintainers, ${r.n - r.spam} merged from the same repos.`));
  } catch {}
}
loadBoard();
</script>
</body>
</html>
